server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ---- index.html must never be cached ----
    # This is what names which hashed JS/CSS bundle to load. The hashed
    # assets below are safe to cache forever (a new build = a new filename),
    # but if index.html itself gets cached by the browser, it keeps pointing
    # at an OLD bundle filename indefinitely -- which is exactly what was
    # happening: rebuilds were correct, but the browser never re-fetched
    # index.html to learn about them. `location =` is an exact match and
    # takes priority over the `location /` block below, and nginx re-applies
    # location matching after try_files rewrites internally to /index.html,
    # so this also covers the SPA-fallback case (any client-side route),
    # not just a literal request for "/index.html".
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ---- React Router ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- .NET API routes ----
location /api/Prescriptions {
    proxy_pass https://medicareapi.applab.co.ke;
    proxy_set_header Host medicareapi.applab.co.ke;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
}

location /api/Drugs {
    proxy_pass https://medicareapi.applab.co.ke;
    proxy_set_header Host medicareapi.applab.co.ke;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
}

    # ---- Spring Boot Backend (general API) ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static assets ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}