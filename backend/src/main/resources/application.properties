 spring.application.name=backend

# Every log line carries the request's correlation id (see RequestIdFilter).
logging.pattern.level=%5p [%X{requestId:-}]

# Actuator: expose only the health check, with no component details
# (database/disk details would describe the infrastructure to anyone).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Don't log every resolved exception: validation failures would log the
# rejected field values (emails, phone numbers, passwords). DevTools turns
# this on in local runs; real errors are still logged by GlobalExceptionHandler.
spring.mvc.log-resolved-exception=false

# OpenAPI / Swagger UI: generated from the controllers, client API only.
# On by default for local development; the docker (production) profile turns
# it off unless API_DOCS_ENABLED=true.
springdoc.paths-to-match=/api/**
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Browser origins allowed to call the API cross-origin (comma-separated).
# Not needed when the SPA is served from the same origin (nginx in docker).
# Native mobile apps are not subject to CORS.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
springdoc.default-produces-media-type=application/json
