spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# SQL statement logging off: statements can carry identifiers and it is noisy.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# Optional: set these to pin the seeded admin account to known credentials.
# If ADMIN_PASSWORD is left unset, DataSeeder generates a random one-time
# password and logs it once on first boot instead of using a fixed default.
admin.seed.email=${ADMIN_EMAIL:admin@medicare.local}
admin.seed.password=${ADMIN_PASSWORD:}

# API docs off in production unless explicitly enabled.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# Same-origin behind nginx by default: no cross-origin browser access unless
# CORS_ALLOWED_ORIGINS lists the origins (comma-separated, exact https URLs).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
