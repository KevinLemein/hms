spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# Optional: set these to pin the seeded admin account to known credentials.
# If ADMIN_PASSWORD is left unset, DataSeeder generates a random one-time
# password and logs it once on first boot instead of using a fixed default.
admin.seed.email=${ADMIN_EMAIL:admin@medicare.local}
admin.seed.password=${ADMIN_PASSWORD:}
