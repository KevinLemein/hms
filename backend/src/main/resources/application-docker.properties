spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# SQL statement logging off: statements can carry identifiers and it is noisy.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# Optional: set these to pin the seeded admin account to known credentials.
# If ADMIN_PASSWORD is left unset, DataSeeder generates a random one-time
# password and logs it once on first boot instead of using a fixed default.
admin.seed.email=${ADMIN_EMAIL:admin@medicare.local}
admin.seed.password=${ADMIN_PASSWORD:}

# API docs off in production unless explicitly enabled.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# Behind nginx: use its X-Forwarded-* headers to know the browser's real
# scheme/host/port, so same-origin requests aren't mistaken for cross-origin
# ones. "native" = Tomcat's RemoteIpValve, which only trusts these headers
# from internal (private-network) proxies such as the nginx container.
server.forward-headers-strategy=native

# Browser origins allowed to call the API (comma-separated, exact URLs).
# Default: the docker-compose web app (http://localhost:3000), as before
# Phase 3. Set CORS_ALLOWED_ORIGINS to the site's real https origin(s) when
# deployed under a domain.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
